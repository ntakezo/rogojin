name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # _examples is its own module in an underscore directory, so the root
      # go commands skip it; build it explicitly or the example rots silently.
      - run: go build ./... && go vet ./...
        working-directory: _examples
